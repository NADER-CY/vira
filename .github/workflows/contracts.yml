name: contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generated OpenAPI is up to date
        run: .github/scripts/run.sh "openapi up to date" python3 scripts/gen_openapi.py --check
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: OpenAPI 3.1 lint
        run: .github/scripts/run.sh "openapi lint" npx --yes @redocly/cli@1.34.5 lint --format=stylish contracts/openapi/public.v1.json contracts/openapi/admin.v1.json
      - name: Event envelope schema is valid JSON Schema
        run: .github/scripts/run.sh "event schema" npx --yes ajv-cli@5.0.0 compile --spec=draft2020 -s contracts/events/envelope.v1.schema.json
